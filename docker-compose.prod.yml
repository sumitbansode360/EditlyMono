services:

  postgres:
    image: postgres:16

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - editly-network

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - editly-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod

    env_file:
      - ./Backend/.env.production

    volumes:
      - ./Backend/media:/app/media
      - ./Backend/staticfiles:/app/staticfiles

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - editly-network

  celery:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod

    command: celery -A core worker --loglevel=info

    env_file:
      - ./Backend/.env.production

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - editly-network

  websocket:
    build:
      context: ./WebSocket
      dockerfile: Dockerfile.prod
    
    env_file:
      - ./WebSocket/.env.production

    restart: unless-stopped

    networks:
      - editly-network
  
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}

    env_file:
      - ./Frontend/.env.production

    restart: unless-stopped

    networks:
      - editly-network

  nginx:
    build:
      context: ./Nginx

    ports:
      - "80:80"

    volumes:
      - ./Backend/media:/app/media:ro

    depends_on:
      - frontend
      - backend
      - websocket

    restart: unless-stopped

    networks:
      - editly-network

networks:
  editly-network:
    driver: bridge

volumes:
  postgres-data: